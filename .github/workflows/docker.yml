name: 构建并推送镜像 / Build and push image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{github.event.repository.name}}

permissions:
  contents: read
  packages: write

jobs:
  # ------------------------------------------------------------------
  # 单元/集成测试：启动代理，跑真实的上游连通性测试
  # ------------------------------------------------------------------
  test:
    name: 测试 / test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码 / checkout
        uses: actions/checkout@v4

      - name: 准备 Python / setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 启动代理 / start the proxy
        # 发布包可能不含 tests/，此时跳过测试而不是让流水线失败
        if: ${{ hashFiles('tests/test.py') != '' }}
        run: |
          python bequiet_proxy.py --http-port 9090 --socks-port 1080 --verbose &
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:9090/bequiet-ca.crl; then break; fi
            sleep 1
          done

      - name: 运行测试 / run the tests
        if: ${{ hashFiles('tests/test.py') != '' }}
        run: |
          python tests/test.py
          python tests/test2.py

  # ------------------------------------------------------------------
  # 构建镜像并推送到 GitHub Container Registry (GHCR)
  # ------------------------------------------------------------------
  build:
    name: 构建并推送 / build and push
    runs-on: ubuntu-latest
    needs: test
    # 测试被跳过时也要继续构建镜像
    if: ${{ !cancelled() }}
    steps:
      - name: 检出代码 / checkout
        uses: actions/checkout@v4

      - name: 准备 QEMU（用于多架构模拟）/ setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: 准备 Buildx / setup buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR / login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{env.REGISTRY}}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: 计算镜像标签 / compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{env.REGISTRY}}/${{env.IMAGE_NAME}}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=long
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=bequiet-proxy
            org.opencontainers.image.description=HTTP + SOCKS5 proxy in front of https://bequiet.pages.dev/fonts/<url>
            org.opencontainers.image.source=${{github.server_url}}/${{github.repository}}

      - name: 构建并推送 / build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{github.event_name != 'pull_request'}}
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{steps.meta.outputs.labels}}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像地址 / summary
        run: |
          echo "### 镜像已推送 / Image pushed" >> ${{env.GITHUB_STEP_SUMMARY}}
          echo '```' >> ${{env.GITHUB_STEP_SUMMARY}}
          echo ${{steps.meta.outputs.tags}} >> ${{env.GITHUB_STEP_SUMMARY}}
          echo '```' >> ${{env.GITHUB_STEP_SUMMARY}}
